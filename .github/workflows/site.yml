name: Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx astro check
      - name: Build
        run: npm run build
      # Almost every page is generated, so a link is never wrong once — an off-by-one in
      # how they are written breaks hundreds at a time and no other check sees it.
      - name: Check internal links
        run: npm run check:links
