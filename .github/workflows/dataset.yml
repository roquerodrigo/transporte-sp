name: Dataset

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
        working-directory: pipeline
      - name: Validate the published dataset
        run: uv run transporte-sp validate
        working-directory: pipeline

  generated-content-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
        working-directory: pipeline
      - name: Regenerate the site content from the dataset
        run: uv run transporte-sp pages
        working-directory: pipeline
      - name: Fail if the committed pages differ from the dataset
        run: |
          if ! git diff --quiet; then
            echo "The generated pages are out of date. Run 'uv run transporte-sp pages'."
            git diff --stat
            exit 1
          fi
